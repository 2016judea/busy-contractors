<html lang="en">
<head>
<meta charset="utf-8">

<meta name="description" content="The Minneapolis contractors with the most open jobs right now, every job address, and their licence phone and email.">

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--body);margin:0}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:24px 64px}
.eyebrow{font:500 11px/1.4 var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
h1{font:var(--h1w) clamp(30px,6.4vw,52px)/1.04 var(--display);margin:10px 0 12px;text-wrap:balance;letter-spacing:-.01em;max-width:19ch}
.lede{font-size:18px;max-width:60ch;margin:0;color:var(--ink2)}

.yours{border-left:3px solid var(--accent);padding:6px 0 6px 12px;margin:18px 0 0;max-width:62ch;color:var(--ink2)}
.yours q{font-style:italic;color:var(--ink)}
.yours a{color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:10px 28px;margin:20px 0 4px;font-variant-numeric:tabular-nums}

.mapbox{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:12px}

.controls{display:flex;flex-direction:column;gap:10px;margin-bottom:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}

:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row2{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
select,.btn,input{font:500 16px var(--body);color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:9px 10px;min-height:44px}
select{max-width:100%}
.btn{cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.lock{font-size:12px;opacity:.75}
.count{font:12px var(--mono);color:var(--muted)}
ol{list-style:none;margin:0;padding:0}
li.it{padding:14px 2px;border-top:1px solid var(--rule);display:grid;grid-template-columns:1fr auto;gap:2px 12px}
.it .a{font-weight:600;font-size:17px;overflow-wrap:anywhere}
.it .m{grid-column:1/-1;font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:3px 12px;font-variant-numeric:tabular-nums}
.it .w{grid-column:1/-1;font-size:14px;color:var(--ink2);margin:2px 0}
.it .c{grid-column:1/-1;font-size:14px;color:var(--ink);margin:4px 0 0;overflow-wrap:anywhere}
.it .c a{color:var(--accent)}
.it details{grid-column:1/-1;font-size:14px;margin-top:4px}
.it summary{cursor:pointer;color:var(--accent);font-weight:500;padding:8px 0;min-height:36px}
.it details ul{margin:4px 0 0;padding:0 0 0 14px;color:var(--ink2)}
.it details li{margin:3px 0}
.it details li span{color:var(--muted);font-size:13px}
.tag{font:500 11px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:5px 7px;border-radius:4px;white-space:nowrap;align-self:start;background:var(--tagbg);color:var(--tagfg)}
.tag.hot{background:var(--hotbg);color:var(--hotfg)}
.blur{filter:blur(4.5px);user-select:none;pointer-events:none}
.ghostrow{border-top:1px solid var(--rule);padding:14px 2px;color:var(--muted)}
.more{margin:14px 0 0}
.pay{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:18px 16px;margin:16px 0}
.pay h2{font:600 22px/1.2 var(--display);margin:0 0 6px}
.pay p{margin:0 0 10px;color:var(--ink2);max-width:58ch}
.pay .price{font:600 18px var(--body);color:var(--ink)}
.pay-btn{font:600 16px var(--body);border-radius:8px;padding:12px 18px;border:1px solid var(--accent);background:var(--accent);color:var(--onaccent);cursor:pointer;min-height:46px}
.pay-btn.alt{background:transparent;color:var(--accent)}
.pay-act{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 10px}
.pwf{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}.pwf input{flex:1 1 200px;letter-spacing:.08em;text-transform:uppercase}
.pwf button{font:600 15px var(--body);border-radius:6px;border:1px solid var(--accent);background:var(--accent);color:var(--onaccent);padding:9px 14px;cursor:pointer;min-height:44px}
.pwerr{flex-basis:100%;margin:0;color:var(--hotfg);font-size:14px}
.pay-co:empty{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
[hidden]{display:none!important}
.unl{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;background:var(--accent);color:var(--onaccent);border-radius:4px;padding:3px 7px}
.note{font-size:13px;color:var(--muted);max-width:66ch;margin-top:36px;border-top:1px solid var(--rule);padding-top:14px}
.note p{margin:0 0 8px}
.toast{font:12px var(--mono);color:var(--accent)}
</style>

    CO.mount("#checkout");b.hidden=true;setTimeout(()=>$("checkout").scrollIntoView({behavior:"smooth",block:"start"}),300)}
  catch(e){CO=null;b.textContent=t;$("toast").textContent="Checkout didn't load. Refresh and try again, or email aidan@brickandmortar.dev."}finally{b.disabled=false}};
async function back(id){const P=$("paid");P.hidden=false;try{const r=await(await fetch("/api/session-status?session_id="+encodeURIComponent(id))).json();
  if(r.paid){$("paidH").textContent="Check your email for your password";$("paidP").textContent=`It's on its way to ${r.email||"your email"}. Enter it here to open the full list.`;P.querySelector(".pwf").hidden=false;track("paid");return}
  $("paidH").textContent="The payment didn't go through";$("paidP").textContent="If you were charged, the password is on its way to your email. Otherwise try again, or write to aidan@brickandmortar.dev."}
  catch(e){$("paidH").textContent="Couldn't confirm the payment yet";$("paidP").textContent="Refresh in a minute. If you were charged, the password is on its way to your email."}}
const qs=new URLSearchParams(location.search),pwq=qs.get("pw"),paidq=qs.get("paid");
if(pwq||paidq){qs.delete("pw");qs.delete("paid");history.replaceState(null,"",location.pathname+(qs.toString()?"?"+qs:"")+location.hash)}
chips();render();track("preview_open");
if(paidq)back(paidq);
const first=pwq||store.get();if(first)unlock(first,pwq?"link":"saved").catch(x=>{if(pwq){$("pwf").hidden=false;$("pw1").value=pwq;$("pwf").querySelector(".pwerr").textContent=x.message}else store.set(null)});
})();
</script>
